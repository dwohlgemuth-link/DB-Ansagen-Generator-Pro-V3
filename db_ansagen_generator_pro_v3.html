<!DOCTYPE html>
<html lang="de" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>DB Ansagen Generator Pro</title>
    <meta name="description" content="Professioneller Simulator für automatisierte Bahn-Ansagen mit KI-Sprachsynthese und DSP-Akustik.">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        db: {
                            red: '#e3001b',
                            hover: '#ff243e',
                            bg: '#000000',
                            panel: '#121212',
                            border: '#3a3a3a'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['Fira Code', 'monospace'],
                    }
                }
            }
        }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&display=swap');
        
        :root {
            color-scheme: dark;
        }

        body {
            background-color: theme('colors.db.bg');
            color: #ffffff;
            /* Subtiles technisches Punktemuster für den Hintergrund */
            background-image: radial-gradient(theme('colors.db.border') 1px, transparent 1px);
            background-size: 24px 24px;
            min-height: 100vh;
        }

        /* Einheitliches Styling für alle Eingabefelder */
        .form-control {
            background-color: #1a1a1a;
            border: 2px solid theme('colors.db.border');
            color: #ffffff;
            transition: all 0.2s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: #ffffff;
            box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.2);
            background-color: #222222;
        }

        .form-control option, .form-control optgroup {
            background-color: theme('colors.db.panel');
            color: white;
        }

        /* Custom Range Slider (Perfektioniert) */
        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
            width: 100%;
            height: 24px;
        }
        input[type=range]:focus { outline: 2px solid #ffffff; outline-offset: 2px; border-radius: 4px; }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            cursor: pointer;
            background: theme('colors.db.border');
            border-radius: 3px;
            transition: background 0.2s;
        }
        input[type=range]:hover::-webkit-slider-runnable-track {
            background: #555555;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: #ffffff;
            border: 2px solid theme('colors.db.red');
            cursor: pointer;
            margin-top: -7px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.8);
            transition: transform 0.1s;
        }
        input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.15); }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: theme('colors.db.border'); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #666666; }

        /* Animationen */
        .wave-container { display: flex; align-items: center; justify-content: center; gap: 4px; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
        .wave-container.active { opacity: 1; }
        .wave-bar { width: 3px; height: 10px; background-color: rgba(255,255,255,0.9); border-radius: 2px; animation: wave 1s ease-in-out infinite; }
        .wave-bar:nth-child(2) { animation-delay: 0.1s; }
        .wave-bar:nth-child(3) { animation-delay: 0.2s; }
        .wave-bar:nth-child(4) { animation-delay: 0.3s; }
        .wave-bar:nth-child(5) { animation-delay: 0.4s; }

        @keyframes wave {
            0%, 100% { height: 10px; }
            50% { height: 24px; }
        }
    </style>
</head>

<body class="p-4 md:p-6 lg:p-8 flex flex-col items-center justify-center font-sans antialiased">

    <script>
        const scenarioSelect = document.getElementById('scenario-select');

        const playBtn = document.getElementById('play-btn');
        const previewBtn = document.getElementById('preview-btn');

        const logConsole = document.getElementById('log-console');
        const logConsoleContainer = document.getElementById('log-console-container');

        let isPlaying = false;
        let audioCtx = null;
        let activeNodes = []; 

        const scenarios = {
            'einfahrt': "Gleis 4. Einfahrt. I C E 8 7 2. Nach. Berlin Ostbahnhof. Abfahrt 15 Uhr 14. Vorsicht bei der Einfahrt.",
            'verspaetung': "Ihre Information zu. Intercity Express 7 3. Nach Basel S B B. Heute circa 15 Minuten später. Grund dafür ist eine Verzögerung im Betriebsablauf. Wir bitten um Entschuldigung.",

        const styles = {

        function log(msg, type='info') {
            const time = new Date().toLocaleTimeString('de-DE', { hour12: false });
            let color = 'text-gray-200';
            
            if (type === 'error') color = 'text-red-400 font-bold';
            if (type === 'success') color = 'text-emerald-400 font-bold';
            if (type === 'warn') color = 'text-amber-400 font-bold';
            
            const entry = document.createElement('div');
            entry.className = color;
            entry.innerHTML = `<span class="text-gray-400 font-normal mr-1">[${time}]</span> ${msg}`;
            logConsole.appendChild(entry);
            logConsoleContainer.scrollTop = logConsoleContainer.scrollHeight;
        }

        function base64ToArrayBuffer(base64) {
            const binaryString = window.atob(base64);
            const bytes = new Uint8Array(binaryString.length);
            for (let i = 0; i < binaryString.length; i++) bytes[i] = binaryString.charCodeAt(i);
            return bytes.buffer;
        }

        function pcmToWav(pcm16, sampleRate) {
            const buffer = new ArrayBuffer(44 + pcm16.byteLength);
            const view = new DataView(buffer);
            const writeString = (view, offset, string) => {
                for (let i = 0; i < string.length; i++) view.setUint8(offset + i, string.charCodeAt(i));
            };
            writeString(view, 0, 'RIFF');
            view.setUint32(4, 36 + pcm16.byteLength, true);
            writeString(view, 8, 'WAVE');
            writeString(view, 12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, 1, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * 2, true);
            view.setUint16(32, 2, true);
            view.setUint16(34, 16, true); 
            writeString(view, 36, 'data');
            view.setUint32(40, pcm16.byteLength, true);
            new Int16Array(buffer, 44).set(pcm16);
            return new Blob([buffer], { type: 'audio/wav' });
        }

        function makeDistortionCurve(amount) {
            const k = typeof amount === 'number' ? amount * 2 : 50; 
            const n_samples = 44100;
            const curve = new Float32Array(n_samples);
            const deg = Math.PI / 180;
            for (let i = 0; i < n_samples; ++i ) {
                const x = i * 2 / n_samples - 1;
                curve[i] = ( 3 + k ) * x * 20 * deg / ( Math.PI + k * Math.abs(x) );
            }
            return curve;
        }

        function createReverb(ctx) {
            const length = ctx.sampleRate * 2.5; 
            const impulse = ctx.createBuffer(2, length, ctx.sampleRate);
            for (let i = 0; i < 2; i++) {
                const channel = impulse.getChannelData(i);
                for (let j = 0; j < length; j++) {
                    channel[j] = (Math.random() * 2 - 1) * Math.exp(-j / (ctx.sampleRate * 0.5));
                }
            }
            const convolver = ctx.createConvolver();
            convolver.buffer = impulse;
            return convolver;
        }

        async function playOriginalGong(env, ctx, destinationNode) {
            return new Promise(resolve => {
                const now = ctx.currentTime;
                
                // Helper for clean, bright sine waves (like modern PA systems)
                function playTone(freq, startTime, duration, vol) {
                    const osc = ctx.createOscillator();
                    osc.type = 'sine'; // Glasklarer Klang
                    osc.frequency.value = freq;
                    
                    const gain = ctx.createGain();
                    
                    // Attack (schnell, aber nicht klickend)
                    gain.gain.setValueAtTime(0, startTime);
                    gain.gain.linearRampToValueAtTime(vol, startTime + 0.02);
                    // Release (natürliches Ausklingen)
                    gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
                    
                    osc.connect(gain);
                    gain.connect(destinationNode);
                    
                    osc.start(startTime);
                    osc.stop(startTime + duration);
                    activeNodes.push(osc);
                }

                if (env === 'bahnhof') {
                    // Klassischer, heller Bahnhofs-Dreiklang (G - E - C)
                    const v = 0.5;
                    playTone(783.99, now,       2.5, v); // G5
                    playTone(659.25, now + 0.6, 2.5, v); // E5
                    playTone(523.25, now + 1.2, 4.0, v); // C5
                    
                    setTimeout(resolve, 3000); 
                } else {
                    // DB Zug-Gong "D" und "B" (D5 und B4)
                    const v = 0.4;
                    
                    // Kurzes Mikrofon-Einschalt-Knacken
                    const click = ctx.createOscillator();
                    const clickGain = ctx.createGain();
                    click.type = 'square';
                    click.frequency.setValueAtTime(100, now);
                    click.frequency.exponentialRampToValueAtTime(10, now + 0.02);
                    clickGain.gain.setValueAtTime(0, now);
                    clickGain.gain.linearRampToValueAtTime(0.02, now + 0.01);
                    clickGain.gain.exponentialRampToValueAtTime(0.001, now + 0.03);
                    click.connect(clickGain);
                    clickGain.connect(destinationNode);
                    click.start(now);
                    click.stop(now + 0.03);
                    activeNodes.push(click);

                    // Die zwei Töne: schnelles D, langes B
                    setTimeout(() => {
                        playTone(587.33, ctx.currentTime, 1.2, v);       // D5
                        playTone(493.88, ctx.currentTime + 0.35, 2.5, v); // B4
                    }, 50);
                    
                    setTimeout(resolve, 2000);
                }
            });
        }

        function startAtmo(ctx, env, destination) {
            const bufferSize = ctx.sampleRate * 2;
            const noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
            const output = noiseBuffer.getChannelData(0);
            let lastOut = 0;
            // Brown Noise Generator (Tiefes Rauschen)
            for (let i = 0; i < bufferSize; i++) {
                const white = Math.random() * 2 - 1;
                output[i] = (lastOut + (0.02 * white)) / 1.02;
                lastOut = output[i];
                output[i] *= 3.5; 
            }
            const noiseSrc = ctx.createBufferSource();
            noiseSrc.buffer = noiseBuffer;
            noiseSrc.loop = true;
            
            const filter = ctx.createBiquadFilter();
            if(env === 'bahnhof') {
                filter.type = 'bandpass';
                filter.frequency.value = 400; // Dumpferes Hall-Rauschen
            } else {
                filter.type = 'lowpass';
                filter.frequency.value = 150; // Zug-Rumpeln
            }
            
            const gain = ctx.createGain();
            gain.gain.value = 0; 

            noiseSrc.connect(filter);
            filter.connect(gain);
            gain.connect(destination);
            
            noiseSrc.start();
            activeNodes.push(noiseSrc);
            
            gain.gain.linearRampToValueAtTime(env === 'bahnhof' ? 0.3 : 0.6, ctx.currentTime + 1);
            return { source: noiseSrc, gainNode: gain };
        }

        async function fetchAI_Audio(text, stylePrompt, voiceId, ctx) {
            log(`Generiere Audio (${voiceId})...`, 'info');
            
            const prompt = `Lies den folgenden Text exakt nach dieser Regieanweisung vor: "${stylePrompt}". \n\nZu lesender Text: ${text}`;
            const apiKey = ""; // API Key handled automatically by the environment
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`;
            
            const payload = {
                contents: [{ parts: [{ text: prompt }] }],
                generationConfig: {
                    responseModalities: ["AUDIO"],
                    speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: voiceId } } }
                },
                model: "gemini-2.5-flash-preview-tts"
            };
            
            const response = await fetch(url, { method: 'POST', body: JSON.stringify(payload) });
            if (!response.ok) throw new Error("API-Verbindungsfehler.");
            
            const result = await response.json();
            const part = result?.candidates?.[0]?.content?.parts?.[0];
            if (!part || !part.inlineData) throw new Error("Keine Audiodaten erhalten.");
            
            const sampleRateMatch = part.inlineData.mimeType.match(/rate=(\d+)/);
            const sampleRate = sampleRateMatch ? parseInt(sampleRateMatch[1], 10) : 24000;
            
            const pcmData = base64ToArrayBuffer(part.inlineData.data);
            const wavBlob = pcmToWav(new Int16Array(pcmData), sampleRate);
            return await ctx.decodeAudioData(await wavBlob.arrayBuffer());
        }

        function stopEngine() {
            activeNodes.forEach(node => {
                try { node.stop(); } catch(e){}
                try { node.disconnect(); } catch(e){}
            });
            activeNodes = [];
            isPlaying = false;
            
            playBtn.disabled = false;
            previewBtn.disabled = false;
            playIcon.style.display = 'inline-block';
            playText.style.display = 'inline-block';
            playWaves.classList.remove('active');
        }

        async function executeAudioPipeline(text, isPreview = false) {
            if (isPlaying) return;
            if (!text.trim()) {
                log("Bitte einen Text eingeben.", "warn");
                return;
            }

            try {
                isPlaying = true;
                playBtn.disabled = true;
                previewBtn.disabled = true;
                if(!isPreview) {
                    playIcon.style.display = 'none';
                    playText.style.display = 'none';
                    playWaves.classList.add('active');
                }
                
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') await audioCtx.resume();

                const voiceId = voiceSelect.value;
                const env = envSelect.value;
                const speedVal = parseFloat(speedSlider.value);
                const fxVal = parseInt(fxSlider.value, 10) / 100;
                const distVal = parseInt(distSlider.value, 10);
                const styleDir = finalStyleInput.value.trim() || "Sachlich";

                // 1. Fetch AI Audio
                const audioBuffer = await fetchAI_Audio(text, styleDir, voiceId, audioCtx);
                
                // 2. Build Effects Graph
                const mainOut = audioCtx.createGain();
                const effectInput = audioCtx.createGain();
                
                // Distortion
                const distortionNode = audioCtx.createWaveShaper();
                if(distVal > 0 && !isPreview) {
                    distortionNode.curve = makeDistortionCurve(distVal);
                    distortionNode.oversample = '4x';
                }
                effectInput.connect(distortionNode);

                // Reverb & EQ
                if (!isPreview) {
                    if (env === 'bahnhof') {
                        const convolver = createReverb(audioCtx);
                        const lowpass = audioCtx.createBiquadFilter();
                        lowpass.type = 'lowpass';
                        lowpass.frequency.value = 3500;

                        const dry = audioCtx.createGain();
                        dry.gain.value = 1.0 - (fxVal * 0.4);
                        const wet = audioCtx.createGain();
                        wet.gain.value = fxVal * 1.5;

                        distortionNode.connect(lowpass);
                        lowpass.connect(dry);
                        lowpass.connect(convolver);
                        convolver.connect(wet);

                        dry.connect(mainOut);
                        wet.connect(mainOut);
                    } else {
                        // Zug (Bordlautsprecher EQ)
                        const highpass = audioCtx.createBiquadFilter();
                        highpass.type = 'highpass';
                        highpass.frequency.value = 300; 
                        
                        const peaking = audioCtx.createBiquadFilter();
                        peaking.type = 'peaking';
                        peaking.frequency.value = 2500;
                        peaking.gain.value = fxVal * 4; 

                        distortionNode.connect(highpass);
                        highpass.connect(peaking);
                        peaking.connect(mainOut);
                    }
                } else {
                    distortionNode.connect(mainOut);
                }
                
                mainOut.connect(audioCtx.destination);

                // 3. Ambient Noise
                let atmoObj = null;
                if(atmoToggle.checked && !isPreview) {
                    atmoObj = startAtmo(audioCtx, env, audioCtx.destination);
                }

                // 4. Synthesize Gong
                if (gongToggle.checked && !isPreview) {
                    log("Spiele Gong...", "info");
                    await playOriginalGong(env, audioCtx, effectInput);
                }

                // 5. Play AI Speech
                log("Spiele Ansage ab...", "success");
                const source = audioCtx.createBufferSource();
                source.buffer = audioBuffer;
                source.playbackRate.value = speedVal;
                source.connect(effectInput);
                
                source.start(audioCtx.currentTime);
                activeNodes.push(source);

                source.onended = () => {
                    log("Abgeschlossen.", "info");
                    if(atmoObj) {
                        atmoObj.gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 1.5);
                        setTimeout(() => atmoObj.source.stop(), 1500);
                    }
                    setTimeout(stopEngine, 500);
                };

            } catch (err) {
                log(err.message, 'error');
                stopEngine();
            }
        }

        // Bind Buttons
        playBtn.addEventListener('click', () => {
            executeAudioPipeline(finalTextInput.value);
        });

        previewBtn.addEventListener('click', () => {
            executeAudioPipeline("Vorschau. " + finalTextInput.value.split('.')[0] + ".", true);
        });

    </script>
</body>
